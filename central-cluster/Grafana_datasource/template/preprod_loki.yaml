apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki-caprinno
  namespace: monitoring-poc
  labels:
    grafana_datasource: "1"
data:
  loki-caprinno.yaml: |
    apiVersion: 1
    datasources:
      - name: loki
        type: loki
        uid: loki-caprinno
        orgId: 2
        url: http://loki-gateway.logging-poc.svc.cluster.local
        access: proxy
        basicAuth: false
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          httpHeaderName2: "Authorization"
        secureJsonData:
          httpHeaderValue1: "caprinno"
          httpHeaderValue2: "Basic Y2Fwcmlubm86dlVWdUdCUVE1RlI4SjYrYlRWU0ZWQT09"
        editable: true
