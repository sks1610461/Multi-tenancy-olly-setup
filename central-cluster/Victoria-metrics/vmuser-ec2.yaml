apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: vmuser-ec2
  namespace: monitoring-poc
spec:
  username: "ec2-agent"
  passwordRef:
    name: vm-auth-ec2-secret
    key: password
  targetRefs:
    # READ → VMSelect tenant 200
    - crd:
        kind: VMCluster/vmselect
        name: vm
        namespace: monitoring-poc
      paths:
        - "/select/200/prometheus/.*"

    # WRITE → VMInsert tenant 200
    - crd:
        kind: VMCluster/vminsert
        name: vm
        namespace: monitoring-poc
      paths:
        - "/o11y/vmauth/insert/200/prometheus/.*"
        - "/o11y/vmauth/insert/200/prometheus/api/v1/write"
      # Drop /o11y/vmauth before forwarding to vminsert
      drop_src_path_prefix_parts: 2
