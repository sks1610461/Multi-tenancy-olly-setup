apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: tenant1
  namespace: monitoring-poc
spec:
  username: tenant1
  passwordRef:
    name: vm-auth-secret
    key: tenant1-password
  targetRefs:
    - crd:
        kind: VMCluster/vmselect
        name: vm
        namespace: monitoring-poc
      paths:
        - "/select/100/prometheus/.*"
    - crd:
        kind: VMCluster/vminsert
        name: vm
        namespace: monitoring-poc
      paths:
        # Match the inbound path forwarded by your ALB rule
        - "/o11y/vmauth/insert/100/prometheus/.*"
        - "/o11y/vmauth/insert/100/prometheus/api/v1/write"
      # Drop the first two path segments ("o11y" and "vmauth") before forwarding to vminsert
      drop_src_path_prefix_parts: 2
